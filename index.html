<title>橹穆恋爱日志</title>
<style>
  :root {
    --pink-bg: #fff2f6;
    --pink-soft: #ffdce7;
    --pink: #e0608f;
    --pink-deep: #c9447a;
    --blue-bg: #eef5ff;
    --blue-soft: #d7e8ff;
    --blue: #3f7fd8;
    --blue-deep: #2c63b5;
    --text: #4a4058;
    --muted: #8d8499;
    --line: #f0e4ec;
    --shadow: 0 6px 22px rgba(201, 120, 160, 0.13);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, #e8f4ff 0%, #f6f1ff 50%, #fff0f5 100%) fixed;
    line-height: 1.6;
  }
  button { font-family: inherit; cursor: pointer; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 40px; }

  header.top { text-align: center; margin-bottom: 24px; }
  header.top h1 {
    margin: 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: 2px;
    background: linear-gradient(90deg, var(--blue), var(--pink-deep));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header.top p { margin: 8px 0 0; color: var(--muted); font-size: 15px; letter-spacing: 1px; }

  .panel {
    background: rgba(255, 255, 255, 0.82);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.9);
  }

  /* ---------- About 橹穆 ---------- */
  .about { margin-bottom: 22px; }
  .about h2 { margin: 0 0 14px; font-size: 21px; text-align: center; color: var(--text); letter-spacing: 1px; }
  .about h2 span { color: var(--blue); }
  .about h2 span + span { color: var(--pink-deep); }
  .profiles { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: stretch; }
  .profiles > * { min-width: 0; }
  .profiles .heart { display: none; }
  @media (min-width: 680px) {
    .profiles { grid-template-columns: 1fr auto 1fr; }
    .profiles .heart { display: flex; align-items: center; font-size: 26px; color: var(--pink); }
  }
  .profile { border-radius: 16px; padding: 16px 18px; border: 1px dashed; }
  .profile.blue { background: var(--blue-bg); border-color: #c4dcfb; }
  .profile.pink { background: var(--pink-bg); border-color: #f8c6d7; }
  .p-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .p-name { font-size: 20px; font-weight: 800; }
  .profile.blue .p-name { color: var(--blue-deep); }
  .profile.pink .p-name { color: var(--pink-deep); }
  .p-role { font-size: 13px; color: var(--muted); }
  .profile dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: 14px; }
  .profile dt { color: var(--muted); }
  .profile dd { margin: 0; }
  .p-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .p-stats span { font-size: 12px; background: #fff; border-radius: 999px; padding: 2px 10px; }
  .profile.blue .p-stats span { color: var(--blue-deep); }
  .profile.pink .p-stats span { color: var(--pink-deep); }

  /* ---------- 两栏 ---------- */
  .layout { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .layout > * { min-width: 0; }
  @media (min-width: 880px) {
    .layout { grid-template-columns: minmax(340px, 440px) 1fr; align-items: start; }
    .col-left { position: sticky; top: 20px; }
    .anniv-list { max-height: calc(100vh - 230px); min-height: 320px; overflow-y: auto; }
  }

  /* ---------- 日历 ---------- */
  .clock {
    text-align: center; font-size: 14px; color: var(--blue-deep);
    background: var(--blue-bg); border-radius: 12px; padding: 8px 10px; margin-bottom: 14px;
  }
  .clock small { color: var(--muted); margin-left: 6px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .cal-nav .month { font-size: 19px; font-weight: 700; color: var(--pink-deep); flex: 1; text-align: center; }
  .icon-btn {

    background: var(--pink-bg); color: var(--pink-deep); font-size: 22px; line-height: 1;
    transition: background .15s;
  }
  .icon-btn:hover { background: var(--pink-soft); }
  .today-btn {
    border: 1px solid var(--blue-soft); background: #fff; color: var(--blue-deep);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap;
  }
  .today-btn:hover { background: var(--blue-bg); }

  .weekdays, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .weekdays div { text-align: center; font-size: 13px; color: var(--muted); padding: 4px 0; }
  .weekdays div:first-child, .weekdays div:last-child { color: var(--pink); }
  .day {
    position: relative; border: none; background: transparent; color: var(--text);
    aspect-ratio: 1 / 1; border-radius: 12px; font-size: 15px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: background .15s, transform .15s;
    padding: 0;
  }
  .day:hover { background: var(--blue-bg); }
  .day.empty { pointer-events: none; }
  .day.today { background: var(--pink); color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(224, 96, 143, .35); }
  .day.today:hover { background: var(--pink-deep); }
  .day.selected:not(.today) { background: var(--blue-soft); color: var(--blue-deep); font-weight: 700; }
  .day.selected.today { outline: 3px solid var(--blue-soft); outline-offset: 1px; }
  .day.flash { animation: flash 1s ease 2; }
  @keyframes flash { 50% { transform: scale(1.15); } }
  .dots { display: flex; gap: 3px; height: 6px; margin-top: 2px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); display: inline-block; }
  .dot.anniv { background: var(--blue); }
  .dot.bday { background: linear-gradient(90deg, var(--blue), var(--pink)); }
  .day.today .dot { background: #fff; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }

  .detail {
    margin-top: 16px; padding: 14px 16px; border-radius: 14px;
    background: var(--pink-bg); border: 1px dashed var(--pink-soft);
    animation: open .25s ease;
  }
  @keyframes open { from { opacity: 0; transform: translateY(-6px); } }
  .detail h3 { margin: 0 0 8px; font-size: 15px; color: var(--pink-deep); }
  .detail .item { background: #fff; border-radius: 10px; padding: 9px 12px; margin-top: 8px; }
  .detail .item .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; margin-right: 6px; }
  .tag.origin { background: var(--pink-soft); color: var(--pink-deep); }
  .tag.yearly { background: var(--blue-soft); color: var(--blue-deep); }
  .tag.bday { background: linear-gradient(90deg, var(--blue-soft), var(--pink-soft)); color: var(--text); }
  .detail .item p { margin: 4px 0 0; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .detail .item .chap-line { font-size: 12px; color: var(--blue-deep); margin-top: 2px; }
  .detail .none { color: var(--muted); font-size: 14px; margin: 0; }
  .link-btn { border: none; background: none; color: var(--blue-deep); padding: 0; font-size: 13px; text-decoration: underline; margin-top: 6px; }

  /* ---------- 右栏 ---------- */
  .right-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  .right-head .asof { font-size: 13px; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
  .filter { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }

  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--pink); color: #fff; box-shadow: 0 4px 12px rgba(224, 96, 143, .3); }
  .btn.primary:hover { background: var(--pink-deep); }
  .btn.soft { background: var(--blue-bg); color: var(--blue-deep); }
  .btn.soft:hover { background: var(--blue-soft); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.ghost:hover { background: #fff; }
  .btn.small { padding: 5px 12px; font-size: 13px; }
  .btn.danger { background: transparent; color: #d0577b; border: 1px solid var(--pink-soft); }
  .btn.danger:hover { background: var(--pink-bg); }

  .anniv-list { display: flex; flex-direction: column; gap: 14px; padding: 2px 4px 4px 2px; }
  .card {

  .card.is-today { border: 2px solid var(--pink-soft); }
  .chap {
    display: inline-block; font-size: 12px; color: var(--blue-deep); background: var(--blue-bg);
    border: none; border-radius: 999px; padding: 1px 10px; margin-bottom: 6px; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

  .chap:hover { background: var(--blue-soft); }
  .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card h3 { margin: 0; font-size: 17px; color: var(--text); word-break: break-word; }
  .card .date { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .count { margin: 10px 0 4px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .count .label { font-size: 14px; color: var(--muted); }
  .count .num { font-size: 44px; font-weight: 800; line-height: 1.1; color: var(--pink-deep); font-variant-numeric: tabular-nums; }
  .count .unit { font-size: 15px; color: var(--pink-deep); }
  .card.future .count .num, .card.future .count .unit { color: var(--blue); }
  .count .party { font-size: 30px; font-weight: 800; color: var(--pink-deep); }
  .card .desc { margin: 4px 0 8px; font-size: 14px; color: #6d6378; white-space: pre-wrap; word-break: break-word; }
  .meta { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--blue-deep); }
  .meta span::before { content: "✧ "; color: var(--pink); }
  .card-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .empty-tip { text-align: center; color: var(--muted); padding: 40px 0; }

  footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 26px; }
  footer .tbc { font-size: 18px; color: var(--pink-deep); letter-spacing: 3px; margin-bottom: 8px; }
  footer button { font-size: 12px; }
  footer .contact-btn { font-size: 14px; margin: 14px 0 10px; }

  /* ---------- 弹窗 ---------- */
  .mask {
    position: fixed; inset: 0; background: rgba(74, 64, 88, .32);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px;
  }
  .mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 20px; width: 100%; max-width: 420px; max-height: calc(100vh - 32px); overflow-y: auto;
    padding: 22px; box-shadow: 0 20px 50px rgba(74, 64, 88, .25); animation: open .2s ease;
  }
  .modal h3 { margin: 0 0 14px; color: var(--pink-deep); }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; font: inherit; color: var(--text); padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: #fffafc; outline: none;

  .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: var(--pink); background: #fff; }
  .modal .hint { font-size: 12px; color: var(--muted); margin: -6px 0 4px; }
  .modal .mail-line { font-size: 12px; color: var(--muted); margin-top: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .modal .mail-line b { color: var(--blue-deep); font-weight: 600; word-break: break-all; }
  .modal textarea { min-height: 90px; resize: vertical; }
  .modal .err { color: #d0577b; font-size: 13px; min-height: 18px; margin-top: 6px; }
  .modal .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: rgba(74, 64, 88, .9); color: #fff; padding: 9px 18px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    .wrap { padding-top: 22px; }
    .panel { padding: 16px; }
    .count .num { font-size: 38px; }
    .day { font-size: 14px; border-radius: 10px; }
  }
</style>

<script>
(function () {
  'use strict';

  const TZ = 'Asia/Shanghai';
  const STORAGE_KEY = 'lumu-anniversaries-v1';
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  const MS_PER_DAY = 86400000;

  /* ---------------- 日期工具（全部用 年-月-日 整数计算） ---------------- */
  const pad = n => String(n).padStart(2, '0');
  const toKey = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  // 把年月日转成「第几天」的整数：UTC 零点 / 86400000，避免夏令时与时区误差
  const dayNum = (y, m, d) => Date.UTC(y, m - 1, d) / MS_PER_DAY;
  const weekdayOf = (y, m, d) => new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;

  function parseKey(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '').trim());
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > daysInMonth(y, mo)) return null;
    return { y, m: mo, d };
  }

  // 第 n 周年对应的日期（2 月 29 日在非闰年按 2 月 28 日算）
  function annivDate(p, n) {
    const y = p.y + n;
    const d = (p.m === 2 && p.d === 29 && !isLeap(y)) ? 28 : p.d;
    return { y, m: p.m, d };
  }

  // 从今天起，下一个周年（含今天）
  function nextAnniv(p, t) {
    const tNum = dayNum(t.y, t.m, t.d);
    let n = Math.max(1, t.y - p.y);
    let a = annivDate(p, n);
    while (dayNum(a.y, a.m, a.d) < tNum) { n++; a = annivDate(p, n); }
    return { n, days: dayNum(a.y, a.m, a.d) - tNum };
  }

  // 东八区当前时间
  let shFormatter = null;
  try {
    shFormatter = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    });
  } catch (e) { shFormatter = null; }

  function nowSH() {
    if (shFormatter) {
      const p = {};
      shFormatter.formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
      const hh = p.hour === '24' ? '00' : p.hour;
      return { y: +p.year, m: +p.month, d: +p.day, hh, mm: p.minute };
    }
    // 极老的浏览器不支持 timeZone 时的兜底：手动 UTC+8
    const t = new Date(Date.now() + 8 * 3600000);
    return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(),
             hh: pad(t.getUTCHours()), mm: pad(t.getUTCMinutes()) };
  }

  const cnDate = p => `${p.y}年${p.m}月${p.d}日 星期${WEEK[weekdayOf(p.y, p.m, p.d)]}`;
  const dotDate = s => s.replace(/-/g, '.');

  /* ---------------- 数据读写 ----------------
   * 本地保存格式：{ items: [...], deleted: [...] }
   * - 来自代码的条目带 src（"日期|标题"），删除时记入 deleted
   * - 每次打开页面，代码里新增、且没被删除过的条目会自动并入
   */
  let uid = 0;
  const keyOf = it => `${it.date}|${it.title}`;

  function sanitize(arr) {
    if (!Array.isArray(arr)) return null;
    const out = [];
    arr.forEach(it => {
      if (!it || typeof it !== 'object') return;
      const p = parseKey(it.date);
      const title = typeof it.title === 'string' ? it.title.trim() : '';
      if (!p || !title) return;
      const item = {
        id: ++uid, date: toKey(p.y, p.m, p.d), title,
        desc: typeof it.desc === 'string' ? it.desc.trim() : '',
        chapter: typeof it.chapter === 'string' ? it.chapter.trim() : ''
      };
      if (typeof it.src === 'string' && it.src) item.src = it.src;
      out.push(item);
    });
    return out;
  }

  function codeItems() {
    return (sanitize(ANNIVERSARIES) || []).map(it => Object.assign(it, { src: keyOf(it) }));
  }

  function mergeWithCode(items, deletedArr) {
    const del = new Set(deletedArr);
    const known = new Set();
    items.forEach(it => { if (it.src) known.add(it.src); known.add(keyOf(it)); });
    const extra = codeItems().filter(c => !del.has(c.src) && !known.has(c.src));
    return items.concat(extra);
  }

  const plain = () => list.map(({ date, chapter, title, desc, src }) =>
    Object.assign({ date, chapter, title, desc }, src ? { src } : {}));

  function loadStored() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (Array.isArray(data)) return { items: sanitize(data) || [], deleted: [] }; // 旧格式
      if (data && typeof data === 'object') {
        return {
          items: sanitize(data.items) || [],
          deleted: Array.isArray(data.deleted) ? data.deleted.filter(x => typeof x === 'string') : []
        };
      }
    } catch (e) { /* 忽略，使用初始数据 */ }
    return null;
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items: plain(), deleted }));
      return true;
    } catch (e) {
      toast('浏览器不允许本地保存，本次修改刷新后会丢失');
      return false;
    }
  }
  function clearStored() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* 忽略 */ }
  }

  const stored = loadStored();
  let deleted = stored ? stored.deleted : [];
  let list = stored ? mergeWithCode(stored.items, deleted) : codeItems();

  /* ---------------- 状态 ---------------- */
  let today = nowSH();
  let todayKey = toKey(today.y, today.m, today.d);
  let view = { y: today.y, m: today.m };
  let selected = todayKey;
  let chapterFilter = '';
  let lastMinute = '';

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------------- About 橹穆 ---------------- */
  function renderProfiles() {
    const tNum = dayNum(today.y, today.m, today.d);
    const cards = PROFILES.map(pr => {
      const b = parseKey(pr.birthday), dbt = parseKey(pr.debut);
      const stats = [];
      if (b) {
        const nb = nextAnniv(b, today);
        stats.push(nb.days === 0 ? `今天是 ${nb.n} 岁生日 🎂` : `距 ${nb.n} 岁生日还有 ${nb.days} 天`);
      }
      if (dbt) stats.push(`公开第 ${tNum - dayNum(dbt.y, dbt.m, dbt.d)} 天`);
      const rows = [
        ['生日', b ? dotDate(pr.birthday) : ''], ['公开时间', dbt ? dotDate(pr.debut) : ''],
        ['星座', pr.zodiac], ['民族', pr.ethnic], ['MBTI', pr.mbti], ['昵称', pr.nick]
      ].filter(r => r[1]);
      return `<div class="profile ${pr.color === 'pink' ? 'pink' : 'blue'}">
        <div class="p-head"><span class="p-name">${esc(pr.name)}</span><span class="p-role">${esc(pr.role || '')}</span></div>
        <dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>
        <div class="p-stats">${stats.map(s => `<span>${s}</span>`).join('')}</div>
      </div>`;
    });
    $('profiles').innerHTML = cards.join('<div class="heart">♡</div>');
  }

  /* ---------------- 计算某天上的事件 ---------------- */
  function eventsOn(y, m, d) {
    const origin = [], yearly = [], bdays = [];
    list.forEach(ev => {
      const p = parseKey(ev.date);
      if (p.y === y && p.m === m && p.d === d) { origin.push(ev); return; }
      const n = y - p.y;
      if (n >= 1) {
        const a = annivDate(p, n);
        if (a.m === m && a.d === d) yearly.push({ ev, n });
      }
    });
    PROFILES.forEach(pr => {
      const b = parseKey(pr.birthday);
      if (!b || y < b.y) return;
      const a = annivDate(b, y - b.y);
      if (a.m === m && a.d === d) bdays.push({ pr, age: y - b.y });
    });
    return { origin, yearly, bdays };
  }

  /* ---------------- 日历渲染 ---------------- */
  function renderCalendar(flashKey) {
    $('monthLabel').textContent = `${view.y}年${view.m}月`;
    const first = weekdayOf(view.y, view.m, 1);
    const total = daysInMonth(view.y, view.m);
    let html = '';
    for (let i = 0; i < first; i++) html += '<div class="day empty"></div>';
    for (let d = 1; d <= total; d++) {
      const key = toKey(view.y, view.m, d);
      const { origin, yearly, bdays } = eventsOn(view.y, view.m, d);
      const cls = ['day'];
      if (key === todayKey) cls.push('today');
      if (key === selected) cls.push('selected');
      if (key === flashKey) cls.push('flash');
      let dots = '';
      if (origin.length) dots += '<i class="dot"></i>';
      if (yearly.length) dots += '<i class="dot anniv"></i>';
      if (bdays.length) dots += '<i class="dot bday"></i>';
      const tip = bdays.map(b => `${b.pr.name}生日`)
        .concat(origin.map(e => e.title), yearly.map(x => x.ev.title)).join('、');
      html += `<button class="${cls.join(' ')}" data-key="${key}" title="${esc(tip)}">
                 <span>${d}</span><span class="dots">${dots}</span></button>`;
    }
    $('days').innerHTML = html;
    renderDetail();
  }

  function renderDetail() {
    const p = parseKey(selected);
    const { origin, yearly, bdays } = eventsOn(p.y, p.m, p.d);
    let html = `<h3>${cnDate(p)}${selected === todayKey ? ' · 今天' : ''}</h3>`;
    if (!origin.length && !yearly.length && !bdays.length) {
      html += '<p class="none">这一天还没有记录～</p>';
    }
    bdays.forEach(({ pr, age }) => {
      html += `<div class="item"><span class="tag bday">生日</span><b>${esc(pr.name)}${age ? ` ${age} 岁生日 🎂` : ' 出生'}</b></div>`;
    });
    origin.forEach(ev => {
      html += `<div class="item"><span class="tag origin">纪念日</span><b>${esc(ev.title)}</b>
               ${ev.chapter ? `<div class="chap-line">${esc(ev.chapter)}</div>` : ''}
               ${ev.desc ? `<p>${esc(ev.desc)}</p>` : ''}</div>`;
    });
    yearly.forEach(({ ev, n }) => {
      html += `<div class="item"><span class="tag yearly">第 ${n} 周年</span><b>${esc(ev.title)}</b>
               <p>${esc(ev.date)}${ev.chapter ? ' · ' + esc(ev.chapter) : ''}</p></div>`;
    });
    html += `<button class="link-btn" id="addOnDay">＋ 在这一天添加纪念日</button>`;
    const box = $('detail');
    box.innerHTML = html;
    box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
    $('addOnDay').onclick = () => openForm(null, selected);
  }

  /* ---------------- 纪念日卡片 ---------------- */
  function statsFor(ev) {
    const p = parseKey(ev.date);
    const tNum = dayNum(today.y, today.m, today.d);
    const diff = tNum - dayNum(p.y, p.m, p.d); // 纪念日当天为 0
    const meta = [];
    if (diff >= 0) {
      const na = nextAnniv(p, today);
      meta.push(na.days === 0 ? `今天是第 ${na.n} 周年 🎉` : `下一个周年还有 ${na.days} 天（第 ${na.n} 周年）`);
      if (diff > 0 && diff % 100 === 0) {
        meta.push(`今天是第 ${diff} 天 🎉`);
      } else {
        const next = (Math.floor(diff / 100) + 1) * 100;
        const hDays = next - diff;
        if (hDays < na.days) meta.push(`距 ${next} 天还有 ${hDays} 天`);
      }
    } else {
      meta.push(`那天是星期${WEEK[weekdayOf(p.y, p.m, p.d)]}，敬请期待`);
    }
    return { diff, meta };
  }

  // 章节顺序：按代码里出现的顺序，其余追加在后
  function chapterOrder() {
    const order = [];
    ANNIVERSARIES.concat(list).forEach(it => {
      const c = it && typeof it.chapter === 'string' ? it.chapter.trim() : '';
      if (c && !order.includes(c)) order.push(c);
    });
    return order.filter(c => list.some(it => it.chapter === c));
  }

  function renderFilter() {
    const chapters = chapterOrder();
    if (chapterFilter && !chapters.includes(chapterFilter)) chapterFilter = '';
    $('chapterFilter').innerHTML = `<option value="">全部章节</option>` +
      chapters.map(c => `<option value="${esc(c)}"${c === chapterFilter ? ' selected' : ''}>${esc(c)}</option>`).join('');
    $('chapterList').innerHTML = chapters.map(c => `<option value="${esc(c)}"></option>`).join('');
  }

  function renderList() {
    $('asof').textContent = `截至 ${todayKey}`;
    renderFilter();
    const box = $('list');
    const shown = list.filter(ev => !chapterFilter || ev.chapter === chapterFilter);
    $('countInfo').textContent = chapterFilter ? `${shown.length} / ${list.length} 条` : `共 ${list.length} 条`;
    if (!shown.length) {
      box.innerHTML = '<div class="empty-tip">还没有纪念日，点「＋ 添加纪念日」写下第一笔吧 ♡</div>';
      return;
    }
    const sorted = shown.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
    box.innerHTML = sorted.map(ev => {
      const { diff, meta } = statsFor(ev);
      const p = parseKey(ev.date);
      let count, cls = 'card';
      if (diff > 0) {
        count = `<span class="label">已经过去 ·</span><span class="num">${diff}</span><span class="unit">天</span>`;
      } else if (diff < 0) {
        cls += ' future';
        count = `<span class="label">还有</span><span class="num">${-diff}</span><span class="unit">天</span>`;
      } else {
        cls += ' is-today';
        count = '<span class="party">就是今天 🎉</span>';
      }
      return `<article class="${cls}">
        ${ev.chapter ? `<button class="chap" data-act="chap" data-id="${ev.id}" title="只看这一章">${esc(ev.chapter)}</button>` : ''}
        <div class="card-top">
          <h3>${esc(ev.title)}</h3>
          <span class="date">${ev.date} 周${WEEK[weekdayOf(p.y, p.m, p.d)]}</span>
        </div>
        <div class="count">${count}</div>
        ${ev.desc ? `<p class="desc">${esc(ev.desc)}</p>` : ''}
        <div class="meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>
        <div class="card-actions">
          <button class="btn soft small" data-act="view" data-id="${ev.id}">查看这一天</button>
          <button class="btn ghost small" data-act="edit" data-id="${ev.id}">编辑</button>
          <button class="btn danger small" data-act="del" data-id="${ev.id}">删除</button>
        </div>
      </article>`;
    }).join('');
  }

  function renderAll() { renderProfiles(); renderCalendar(); renderList(); }

  /* ---------------- 时钟 & 零点自动刷新 ---------------- */
  function tick() {
    const n = nowSH();
    const minuteKey = `${toKey(n.y, n.m, n.d)} ${n.hh}:${n.mm}`;
    if (minuteKey === lastMinute) return;
    lastMinute = minuteKey;
    $('clock').innerHTML = `${cnDate(n)} ${n.hh}:${n.mm}<small>北京时间</small>`;
    const newKey = toKey(n.y, n.m, n.d);
    if (newKey !== todayKey) {
      const wasOnToday = selected === todayKey;
      const viewWasToday = view.y === today.y && view.m === today.m;
      today = n; todayKey = newKey;
      if (wasOnToday) selected = todayKey;
      if (viewWasToday) view = { y: n.y, m: n.m };
      renderAll();
    }
  }

  /* ---------------- 交互 ---------------- */
  function goTo(key, flash) {
    const p = parseKey(key);
    view = { y: p.y, m: p.m };
    selected = key;
    renderCalendar(flash ? key : null);
  }

  $('prevMonth').onclick = () => {
    view = view.m === 1 ? { y: view.y - 1, m: 12 } : { y: view.y, m: view.m - 1 };
    renderCalendar();
  };
  $('nextMonth').onclick = () => {
    view = view.m === 12 ? { y: view.y + 1, m: 1 } : { y: view.y, m: view.m + 1 };
    renderCalendar();
  };
  $('goToday').onclick = () => goTo(todayKey, true);

  $('days').addEventListener('click', e => {
    const btn = e.target.closest('.day[data-key]');
    if (!btn) return;
    selected = btn.dataset.key;
    renderCalendar();
  });

  $('chapterFilter').addEventListener('change', e => {
    chapterFilter = e.target.value;
    renderList();
    $('list').scrollTop = 0;
  });

  $('list').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const ev = list.find(x => x.id === +btn.dataset.id);
    if (!ev) return;
    const act = btn.dataset.act;
    if (act === 'chap') {
      chapterFilter = ev.chapter;
      renderList();
      $('list').scrollTop = 0;
    } else if (act === 'view') {
      goTo(ev.date, true);
      if (window.matchMedia('(max-width: 879px)').matches) {
        $('calendarPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    } else if (act === 'edit') {
      openForm(ev);
    } else if (act === 'del') {
      if (confirm(`确定删除「${ev.title}」吗？`)) {
        const k = ev.src || keyOf(ev);
        if (!deleted.includes(k)) deleted.push(k);
        list = list.filter(x => x !== ev);
        save(); renderAll(); toast('已删除');
      }
    }
  });

  /* 弹窗 */
  let editing = null;
  function openForm(ev, presetDate) {
    editing = ev || null;
    $('formTitle').textContent = ev ? '编辑纪念日' : '添加纪念日';
    $('fDate').value = ev ? ev.date : (presetDate || todayKey);
    $('fChapter').value = ev ? ev.chapter : (chapterFilter || '');
    $('fTitle').value = ev ? ev.title : '';
    $('fDesc').value = ev ? ev.desc : '';
    $('fErr').textContent = '';
    $('mask').classList.add('show');
    setTimeout(() => $('fTitle').focus(), 50);
  }
  function closeForm() { $('mask').classList.remove('show'); editing = null; }
  $('addBtn').onclick = () => openForm(null);
  $('cancelBtn').onclick = closeForm;
  $('mask').addEventListener('click', e => { if (e.target === $('mask')) closeForm(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeForm(); closeContact(); } });

  /* 联系我们
   * - FORMSPREE_ID 填了：网页直接把消息发到你的邮箱（通过 Formspree）
   * - FORMSPREE_ID 为空或发送失败：改为打开访客自己的邮件 App
   */
  const CONTACT_EMAIL = 'akatprojector@outlook.com';
  const FORMSPREE_ID = 'xrpewopy';  // Formspree 表单 ID（formspree.io/f/ 后面那串）
  $('cAddr').textContent = CONTACT_EMAIL;
  $('cNote').textContent = FORMSPREE_ID ? '消息会直接发送给我们。' : '点击发送后会打开你的邮件 App。';
  function openContact() {
    $('cErr').textContent = '';
    $('contactMask').classList.add('show');
    setTimeout(() => $('cMsg').focus(), 50);
  }
  function closeContact() { $('contactMask').classList.remove('show'); }
  $('contactBtn').onclick = openContact;
  $('cCancel').onclick = closeContact;
  $('contactMask').addEventListener('click', e => { if (e.target === $('contactMask')) closeContact(); });

  function openMailApp(subject, body) {
    location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  let sending = false;
  $('contactForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (sending) return;
    const msg = $('cMsg').value.trim();
    if (!msg) { $('cErr').textContent = '内容不能为空'; return; }
    $('cErr').textContent = '';
    const name = $('cName').value.trim();
    const reply = $('cReply').value.trim();
    const type = $('cType').value;
    const subject = `【橹穆恋爱日志】${type}${name ? ' - ' + name : ''}`;
    const body = [
      msg, '', '——',
      `称呼：${name || '（未填写）'}`,
      `联系方式：${reply || '（未填写）'}`,
      `发送时间：${todayKey}（北京时间）`,
      `来自：${location.href}`
    ].join('\n');

    if (!FORMSPREE_ID) {
      openMailApp(subject, body);
      toast('正在打开邮件 App，确认后点发送即可');
      return;
    }

    sending = true;
    $('cSend').textContent = '发送中…';
    try {
      const payload = { _subject: subject, 类型: type, 称呼: name || '（未填写）',
                        联系方式: reply || '（未填写）', 内容: msg, 页面: location.href, _gotcha: $('cTrap').value };
      if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(reply)) payload._replyto = reply; // 填了邮箱就能直接回复
      const res = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      $('contactForm').reset();
      closeContact();
      toast('已发送，谢谢你 ♡');
    } catch (err) {
      $('cErr').textContent = '发送失败了，可以再试一次，或点下面复制邮箱自己发邮件。';
    } finally {
      sending = false;
      $('cSend').textContent = '发送';
    }
  });

  $('cCopy').onclick = () => {
    const done = () => toast('邮箱已复制');
    const fallback = () => {
      const t = document.createElement('textarea');
      t.value = CONTACT_EMAIL; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (err) { toast(CONTACT_EMAIL); }
      t.remove();
    };
    try {
      navigator.clipboard.writeText(CONTACT_EMAIL).then(done, fallback);
    } catch (err) { fallback(); }
  };

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const p = parseKey($('fDate').value);
    const title = $('fTitle').value.trim();
    const desc = $('fDesc').value.trim();
    const chapter = $('fChapter').value.trim();
    if (!p) { $('fErr').textContent = '请选择一个有效的日期'; return; }
    if (!title) { $('fErr').textContent = '标题不能为空'; return; }
    const date = toKey(p.y, p.m, p.d);
    const wasEdit = !!editing;
    if (editing) {
      Object.assign(editing, { date, title, desc, chapter });
    } else {
      list.push({ id: ++uid, date, title, desc, chapter });
    }
    closeForm();
    save();
    renderList();
    goTo(date, true);
    toast(wasEdit ? '已保存修改' : '已添加 ♡');
  });

  /* 导出 / 导入 */
  $('exportBtn').onclick = () => {
    const data = { app: 'lumu-anniversary', version: 2, exportedAt: todayKey, anniversaries: plain(), deleted };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `橹穆纪念日-${todayKey}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('已导出备份文件');
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let parsed;
      try { parsed = JSON.parse(reader.result); } catch (err) { toast('文件不是有效的 JSON'); return; }
      const arr = sanitize(Array.isArray(parsed) ? parsed : parsed && (parsed.anniversaries || parsed.items));
      if (!arr || !arr.length) { toast('文件里没有找到有效的纪念日'); return; }
      if (!confirm(`将导入 ${arr.length} 条纪念日，并覆盖当前的 ${list.length} 条，确定吗？`)) return;
      deleted = (parsed && Array.isArray(parsed.deleted)) ? parsed.deleted.filter(x => typeof x === 'string') : [];
      list = mergeWithCode(arr, deleted);
      save(); renderAll();
      toast(`已导入，共 ${list.length} 条纪念日`);
    };
    reader.onerror = () => toast('读取文件失败');
    reader.readAsText(file, 'utf-8');
  });

  $('resetBtn').onclick = () => {
    if (!confirm('将清除本浏览器保存的所有修改（包括网页上添加的纪念日），恢复为代码中的数据。建议先导出备份。确定吗？')) return;
    clearStored();
    deleted = [];
    list = codeItems();
    chapterFilter = '';
    renderAll(); toast('已恢复初始数据');
  };

  let toastTimer = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------------- 启动 ---------------- */
  tick();
  renderAll();
  setInterval(tick, 1000); // 每秒检查一次，分钟变化才更新显示；跨过零点自动重算
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
</body>
</html>
